<!DOCTYPE html>
<html lang="fr">
<head>

  <title>Emmanuel Dimension</title>
  <!-- React & ReactDOM -->

<body class="bg-gray-900 text-white min-h-screen">
  <div id="root"></div>

    function App() {
      return (

          <h1 class="text-4xl font-bold text-indigo-500 mb-4">Emmanuel Dimension</h1>

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</html>
